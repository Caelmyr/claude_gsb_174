<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>集群事件 Cluster Events — 分布式 MapReduce</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="app-nav"></header>
  <main class="page">
    <h1 class="page-title">集群事件时间线 <span>Cluster Event Timeline</span></h1>
    <p class="page-desc">统一查看节点注册、失联、资源回收与任务改派；所有事件按实际发生时间排序，不依赖具体作业。A single job-independent timeline for node registration, loss, reclamation and task reassignment.</p>

    <div class="flex wrap mb">
      <input id="search" placeholder="搜索节点 / 作业 / 任务 / 描述 Search…" style="max-width:280px">
      <select id="kind" style="max-width:220px">
        <option value="">事件类型 Type: 全部 All</option>
      </select>
      <input id="worker_id" placeholder="Worker ID" style="max-width:180px">
      <input id="job_id" placeholder="Job ID" style="max-width:180px">
      <button class="btn small" id="refresh">刷新 Refresh</button>
      <label class="small muted flex" style="gap:6px"><input type="checkbox" id="auto" checked style="width:auto">自动刷新 Auto</label>
    </div>

    <div class="stat-tiles" id="stats"></div>

    <div class="card mt">
      <div class="flex between mb">
        <h2>事件时间线 <span class="sub">Chronological events</span></h2>
        <span class="small muted" id="event-count"></span>
      </div>
      <div class="table-wrap" id="events"></div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/cluster-events.js"></script>
</body>
</html>
